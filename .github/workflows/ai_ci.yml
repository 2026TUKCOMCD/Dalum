name: AI CI Pipeline

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'Dalum-AI/**'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'Dalum-AI/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: pip 업그레이드
        run: |
          python -m pip install --upgrade pip

      - name: 의존성 설치
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint 검사 (flake8)
        run: |
          pip install flake8
          flake8 vit || true

      - name: 테스트 실행 (pytest)
        run: |
          pip install pytest
          pytest || true