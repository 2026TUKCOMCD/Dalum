name: Dalum AI CI

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'Dalum-AI/**'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'Dalum-AI/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Lint 검사
        run: |
          pip install flake8
          flake8 Dalum-AI/vit || true

      - name: DockerHub 로그인
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.AI_DOCKER_USERNAME }}
          password: ${{ secrets.AI_DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 & Push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./Dalum-AI
          push: true
          tags: |
            ${{ secrets.AI_DOCKER_USERNAME }}/dalum-ai:latest
            ${{ secrets.AI_DOCKER_USERNAME }}/dalum-ai:${{ github.sha }}