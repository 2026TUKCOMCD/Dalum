name: Dalum CR CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Dalum-CR/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Dalum-CR/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.AI_DOCKER_USERNAME }}
          password: ${{ secrets.AI_DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드
        run: |
          docker build -t ${{ secrets.AI_DOCKER_USERNAME }}/dalum-cr:latest ./Dalum-CR

      - name: Docker Hub 푸시
        run: |
          docker push ${{ secrets.AI_DOCKER_USERNAME }}/dalum-cr:latest