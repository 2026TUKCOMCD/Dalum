permissions:
  contents: read # 코드 읽기 권한
  pull-requests: write # PR 댓글 작성 권한
  issues: write # 이슈 댓글 작성 권한

name: Vercel Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dalum-FE/**"
      - ".github/workflows/preview.yml"

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dalum-FE

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 설정 (npm 캐싱)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Dalum-FE/package-lock.json

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. 린트 검사
      - name: Run lint
        run: npm run lint

      # 5. Vercel CLI 설치
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # 6. Vercel 환경변수 다운로드
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # 7. 프로젝트 빌드
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      # 8. Vercel에 배포 (prebuilt)
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      # 9. 배포 URL을 출력 변수로 저장
      - name: Deploy and capture URL
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # 10. PR에 배포 URL 코멘트
      - name: Comment PR with deployment URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `💻 Preview 배포가 완료되었습니다!\n\n🔗 Preview URL: ${{ steps.deploy.outputs.url }}`
            })
