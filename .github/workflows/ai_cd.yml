name: Dalum AI CD

on:
  workflow_run:
    workflows: ["Dalum AI CI"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}

    steps:
      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "${{ secrets.AI_DOCKER_PASSWORD }}" | docker login -u "${{ secrets.AI_DOCKER_USERNAME }}" --password-stdin

            docker pull ${{ secrets.AI_DOCKER_USERNAME }}/dalum-ai:latest

            docker stop dalum-ai || true
            docker rm dalum-ai || true

            docker run -d \
              --name dalum-ai \
              --env-file /home/ubuntu/Dalum/.env \
              -p 8000:8000 \
              --restart always \
              ${{ secrets.AI_DOCKER_USERNAME }}/dalum-ai:latest

            docker image prune -f