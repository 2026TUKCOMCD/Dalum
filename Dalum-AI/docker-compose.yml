services:
  dalum-ai:
    image: wooyoung1/dalum-ai:latest
    container_name: dalum-ai
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ~/Dalum/Dalum-AI/dupe:/app/dupe
      - ~/Dalum/Dalum-AI/app:/app/app          
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    