name: Dalum BE CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'Dalum-BE/**'  # 백엔드 코드가 바뀔 때만 실행
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'Dalum-BE/**'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./Dalum-BE

      # 4. 테스트 및 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        working-directory: ./Dalum-BE

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' # PR일 때는 로그인이랑 푸시 안 함
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        if: github.event_name != 'pull_request' # PR일 때는 푸시 안 함
        uses: docker/build-push-action@v5
        with:
          context: ./Dalum-BE
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/dalum-server:latest