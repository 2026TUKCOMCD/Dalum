spring:
  application:
    name: dalum
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB # 파일 하나 당 최대 크기
      max-request-size: 10MB # 요청 하나 당 최대 크기


  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${S3_BUCKET_NAME}